<!doctype html>
<html>
<body style="margin:0;padding:0;background:#0a0a0a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#0a0a0a;padding:32px 16px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:440px;background:#141414;border:1px solid #262626;border-radius:20px;">
        <tr><td align="center" style="padding:32px 32px 8px;">
          <img src="{{ .SiteURL }}/logo-email.png" alt="MoFi Life" width="140" style="display:block;border:0;height:auto;">
        </td></tr>
        <tr><td align="center" style="padding:16px 32px 4px;color:#ffffff;font-size:20px;font-weight:700;">Confirm your email</td></tr>
        <tr><td align="center" style="padding:4px 32px 20px;color:#a3a3a3;font-size:14px;line-height:1.5;">Enter this 6-digit code in the app to finish creating your account.</td></tr>
        <tr><td align="center" style="padding:0 32px 20px;">
          <div style="display:inline-block;background:#0a0a0a;border:1px solid #262626;border-radius:14px;padding:16px 28px;color:#10b981;font-size:34px;font-weight:700;letter-spacing:10px;font-family:'SF Mono',Menlo,Consolas,monospace;">{{ .Token }}</div>
        </td></tr>
        <tr><td align="center" style="padding:0 32px 32px;color:#737373;font-size:12px;line-height:1.6;">
          The code works for a short time. If you did not sign up, you can ignore this email.<br>Never share this code with anyone. We will never ask for it.
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
