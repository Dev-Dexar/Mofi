# The same thing for nginx, if you use that instead of Caddy. Put it in /etc/nginx/sites-available/, link it, get a certificate
# (for example: sudo certbot --nginx -d your-domain.com), then: sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    server_name your-domain.com;
    root /var/www/mofi/frontend;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8001;                      # no trailing slash: the path is passed on as it is
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;         # SET, not appended: the backend trusts this header (TRUST_PROXY_HEADERS=true)
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
